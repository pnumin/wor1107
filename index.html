<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>귀여운 보석 맞추기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0%, #1d1d33, #050508 70%);
    color: #eee; font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 16px;
    user-select: none;
  }
  h1 { margin: 4px 0 12px; font-size: 28px; letter-spacing: 2px;
       background: linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcB77,#4d96ff,#c77dff);
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hud { display: flex; gap: 10px; width: 100%; max-width: 560px; margin-bottom: 10px; }
  .stat { flex: 1; background: #15151f; border: 1px solid #2a2a3a; border-radius: 10px; padding: 8px; text-align: center; }
  .stat .label { font-size: 12px; color: #999; }
  .stat .value { font-size: 22px; font-weight: bold; }
  #wrap { position: relative; width: 100%; max-width: 560px; }
  canvas { display: block; width: 100%; border-radius: 12px; touch-action: none; cursor: pointer;
           box-shadow: 0 0 30px rgba(120,100,255,.25); }
  .buttons { display: flex; gap: 10px; margin-top: 12px; }
  button { background: #2a2a40; color: #eee; border: 1px solid #44446a; border-radius: 8px;
           padding: 10px 18px; font-size: 15px; cursor: pointer; font-family: inherit; }
  button:hover { background: #3a3a58; }
  #overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
             background: rgba(0,0,0,.75); border-radius: 12px; gap: 12px; }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 34px; }
  #overlay p { margin: 0; font-size: 18px; }
  #combo { position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%); font-size: 40px; font-weight: 900;
           color: #ffd93d; text-shadow: 0 0 12px #ff8800; pointer-events: none; opacity: 0; transition: opacity .3s; }
  .help { margin-top: 10px; font-size: 13px; color: #888; text-align: center; }
</style>
</head>
<body>
<h1>🐥 귀여운 보석 맞추기</h1>
<div class="hud">
  <div class="stat"><div class="label">점수</div><div class="value" id="score">0</div></div>
  <div class="stat"><div class="label">남은 이동</div><div class="value" id="moves">10</div></div>
  <div class="stat"><div class="label">최고 점수</div><div class="value" id="best">0</div></div>
</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="combo"></div>
  <div id="overlay">
    <h2>게임 종료!</h2>
    <p id="finalScore"></p>
    <button id="againBtn">다시 하기</button>
  </div>
</div>
<div class="buttons">
  <button id="hintBtn">💡 힌트</button>
  <button id="newBtn">🔄 새 게임</button>
</div>
<div class="help">같은 보석 3개 이상을 가로/세로로 맞추거나, 2×2 사각형으로 모으면(보너스 +50) 사라집니다. 클릭 또는 드래그로 이웃한 보석과 자리를 바꿉니다.</div>

<script>
const N = 8, TYPES = 6, MAX_MOVES = 10;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
// 귀여운 이모지 보석과 배경 색
const EMOJIS = ['🐱', '🐶', '🐥', '🐸', '🐳', '🐼'];
const COLORS = ['#ff8fab', '#ffa94d', '#ffd93d', '#69db7c', '#74c0fc', '#c69cff'];

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return `rgb(${r},${g},${b})`;
}

function drawGem(t, cx, cy, R, glow) {
  const col = COLORS[t];
  ctx.save();
  if (glow) { ctx.shadowColor = '#fff'; ctx.shadowBlur = R * 0.8; }
  // 말랑한 동그란 배경
  ctx.beginPath();
  ctx.arc(cx, cy, R * 1.05, 0, Math.PI * 2);
  const g = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R * 1.05);
  g.addColorStop(0, shade(col, 0.7));
  g.addColorStop(1, shade(col, 0.1));
  ctx.fillStyle = g;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = shade(col, -0.25);
  ctx.lineWidth = Math.max(1, R * 0.07);
  ctx.stroke();
  // 이모지
  ctx.font = `${R * 1.3}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(EMOJIS[t], cx, cy + R * 0.08);
  ctx.restore();
}

// ---------- 상태 ----------
let grid, score, moves, busy, selected, hint, combo;
let particles = [], floaters = [];
let best = 0;
try { best = +localStorage.getItem('gemBest') || 0; } catch (e) {}
let cell = 60, dpr = 1;

const rnd = n => Math.floor(Math.random() * n);
const gem = (t, r, c) => ({ t, x: c, y: r, scale: 1 });

function newBoard() {
  grid = [];
  for (let r = 0; r < N; r++) {
    grid.push([]);
    for (let c = 0; c < N; c++) {
      let t;
      do { t = rnd(TYPES); } while (
        (c >= 2 && grid[r][c - 1].t === t && grid[r][c - 2].t === t) ||
        (r >= 2 && grid[r - 1][c].t === t && grid[r - 2][c].t === t) ||
        (r >= 1 && c >= 1 && grid[r - 1][c - 1].t === t && grid[r - 1][c].t === t && grid[r][c - 1].t === t));
      grid[r].push(gem(t, r, c));
    }
  }
  if (!hasMoves()) newBoard();
}

function findMatches() {
  const set = new Set();
  for (let r = 0; r < N; r++) {
    let run = 1;
    for (let c = 1; c <= N; c++) {
      if (c < N && grid[r][c] && grid[r][c - 1] && grid[r][c].t === grid[r][c - 1].t) run++;
      else { if (run >= 3) for (let k = 1; k <= run; k++) set.add(r * N + c - k); run = 1; }
    }
  }
  for (let c = 0; c < N; c++) {
    let run = 1;
    for (let r = 1; r <= N; r++) {
      if (r < N && grid[r][c] && grid[r - 1][c] && grid[r][c].t === grid[r - 1][c].t) run++;
      else { if (run >= 3) for (let k = 1; k <= run; k++) set.add((r - k) * N + c); run = 1; }
    }
  }
  // 2x2 사각형
  for (const [r, c] of findSquares()) {
    set.add(r * N + c); set.add(r * N + c + 1); set.add((r + 1) * N + c); set.add((r + 1) * N + c + 1);
  }
  return set;
}

// 같은 보석 2x2 사각형의 왼쪽 위 좌표 목록
function findSquares() {
  const list = [];
  for (let r = 0; r < N - 1; r++) for (let c = 0; c < N - 1; c++) {
    const a = grid[r][c], b = grid[r][c + 1], d = grid[r + 1][c], e = grid[r + 1][c + 1];
    if (a && b && d && e && a.t === b.t && a.t === d.t && a.t === e.t) list.push([r, c]);
  }
  return list;
}

function swapCells(r1, c1, r2, c2) {
  const tmp = grid[r1][c1]; grid[r1][c1] = grid[r2][c2]; grid[r2][c2] = tmp;
}

function findMove() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc;
      if (r2 >= N || c2 >= N) continue;
      swapCells(r, c, r2, c2);
      const ok = findMatches().size > 0;
      swapCells(r, c, r2, c2);
      if (ok) return [r, c, r2, c2];
    }
  }
  return null;
}
const hasMoves = () => !!findMove();

// ---------- 애니메이션 ----------
function animate(ms, fn) {
  return new Promise(res => {
    const st = performance.now();
    function step(now) {
      const p = Math.min(1, (now - st) / ms);
      fn(p);
      if (p < 1) requestAnimationFrame(step); else res();
    }
    requestAnimationFrame(step);
  });
}
const easeInOut = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const easeOutBounce = p => {
  const n = 7.5625, d = 2.75;
  if (p < 1 / d) return n * p * p;
  if (p < 2 / d) return n * (p -= 1.5 / d) * p + .75;
  if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + .9375;
  return n * (p -= 2.625 / d) * p + .984375;
};

async function animSwap(a, b) {
  const ax = a.x, ay = a.y, bx = b.x, by = b.y;
  await animate(160, p => {
    const e = easeInOut(p);
    a.x = ax + (bx - ax) * e; a.y = ay + (by - ay) * e;
    b.x = bx + (ax - bx) * e; b.y = by + (ay - by) * e;
  });
}

async function trySwap(r1, c1, r2, c2) {
  if (busy) return;
  busy = true; selected = null; hint = null;
  const a = grid[r1][c1], b = grid[r2][c2];
  await animSwap(a, b);
  swapCells(r1, c1, r2, c2);
  if (findMatches().size === 0) {
    await animSwap(a, b);
    swapCells(r1, c1, r2, c2);
    busy = false;
    return;
  }
  moves--;
  updateHud();
  await resolve();
  busy = false;
  if (moves <= 0) gameOver();
}

async function resolve() {
  combo = 0;
  while (true) {
    const m = findMatches();
    if (!m.size) break;
    combo++;
    const squares = findSquares();
    const pts = (m.size * 10 + squares.length * 50) * combo;
    score += pts;
    updateHud();
    if (squares.length) showCombo('사각형 보너스!');
    else if (combo >= 2) showCombo(combo);
    const gems = [...m].map(k => grid[Math.floor(k / N)][k % N]);
    let sx = 0, sy = 0;
    gems.forEach(g => { sx += g.x; sy += g.y; spawnParticles(g); });
    floaters.push({ text: '+' + pts, x: sx / gems.length, y: sy / gems.length, life: 1 });
    await animate(220, p => gems.forEach(g => g.scale = 1 - p));
    m.forEach(k => grid[Math.floor(k / N)][k % N] = null);
    await gravity();
  }
  if (!hasMoves()) await shuffle();
}

async function gravity() {
  const moving = [];
  for (let c = 0; c < N; c++) {
    let write = N - 1;
    for (let r = N - 1; r >= 0; r--) {
      if (grid[r][c]) {
        const g = grid[r][c];
        grid[r][c] = null;
        grid[write][c] = g;
        if (write !== r) moving.push({ g, from: g.y, to: write });
        write--;
      }
    }
    const missing = write + 1;
    for (let r = write; r >= 0; r--) {
      const g = gem(rnd(TYPES), r - missing, c);
      grid[r][c] = g;
      moving.push({ g, from: g.y, to: r });
    }
  }
  const maxD = Math.max(1, ...moving.map(m => m.to - m.from));
  await animate(180 + maxD * 45, p => {
    moving.forEach(m => {
      m.g.y = m.from + (m.to - m.from) * easeOutBounce(p);
    });
  });
  moving.forEach(m => m.g.y = m.to);
}

async function shuffle() {
  showCombo('섞는 중...');
  const all = grid.flat();
  await animate(250, p => all.forEach(g => g.scale = 1 - p));
  do {
    const ts = all.map(g => g.t).sort(() => Math.random() - 0.5);
    all.forEach((g, i) => g.t = ts[i]);
  } while (findMatches().size || !hasMoves());
  await animate(250, p => all.forEach(g => g.scale = p));
}

function spawnParticles(g) {
  const col = COLORS[g.t];
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2, s = 0.03 + Math.random() * 0.08;
    particles.push({ x: g.x + 0.5, y: g.y + 0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.03, life: 1, col });
  }
}

let comboTimer;
function showCombo(n) {
  const el = document.getElementById('combo');
  el.textContent = typeof n === 'number' ? `${n} 콤보!` : n;
  el.style.opacity = 1;
  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => el.style.opacity = 0, 700);
}

// ---------- 렌더링 ----------
function resize() {
  const w = document.getElementById('wrap').clientWidth;
  dpr = window.devicePixelRatio || 1;
  cv.width = w * dpr; cv.height = w * dpr;
  cv.style.height = w + 'px';
  cell = w / N;
}

function render(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = cell * N;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, W);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    ctx.fillStyle = (r + c) % 2 ? '#0d0d16' : '#14141f';
    ctx.fillRect(c * cell, r * cell, cell, cell);
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, W); ctx.clip();

  if (selected) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.strokeRect(selected[1] * cell + 3, selected[0] * cell + 3, cell - 6, cell - 6);
  }
  const hintSet = hint ? [[hint[0], hint[1]], [hint[2], hint[3]]] : [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const g = grid[r][c];
    if (!g || g.scale <= 0) continue;
    let s = g.scale;
    const isSel = selected && selected[0] === r && selected[1] === c;
    if (isSel) s *= 1 + Math.sin(now / 120) * 0.06;
    const isHint = hintSet.some(([hr, hc]) => hr === r && hc === c);
    if (isHint) s *= 1 + Math.sin(now / 150) * 0.1;
    drawGem(g.t, (g.x + 0.5) * cell, (g.y + 0.5) * cell, cell * 0.4 * s, isHint);
  }
  // 파티클
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.004; p.life -= 0.025;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x * cell, p.y * cell, cell * 0.06 * p.life + 1, 0, Math.PI * 2); ctx.fill();
  });
  // 점수 표시
  floaters = floaters.filter(f => f.life > 0);
  ctx.font = `bold ${cell * 0.4}px sans-serif`;
  ctx.textAlign = 'center';
  floaters.forEach(f => {
    f.life -= 0.02; f.y -= 0.015;
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeText(f.text, (f.x + 0.5) * cell, (f.y + 0.5) * cell);
    ctx.fillText(f.text, (f.x + 0.5) * cell, (f.y + 0.5) * cell);
  });
  ctx.globalAlpha = 1;
  ctx.restore();
  requestAnimationFrame(render);
}

// ---------- 입력 ----------
let down = null;
function cellAt(e) {
  const rect = cv.getBoundingClientRect();
  const c = Math.floor((e.clientX - rect.left) / rect.width * N);
  const r = Math.floor((e.clientY - rect.top) / rect.height * N);
  return (r >= 0 && r < N && c >= 0 && c < N) ? [r, c] : null;
}
cv.addEventListener('pointerdown', e => {
  if (busy || moves <= 0) return;
  const p = cellAt(e);
  if (!p) return;
  down = { p, x: e.clientX, y: e.clientY };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  const th = cv.getBoundingClientRect().width / N * 0.35;
  if (Math.abs(dx) < th && Math.abs(dy) < th) return;
  const [r, c] = down.p;
  let r2 = r, c2 = c;
  if (Math.abs(dx) > Math.abs(dy)) c2 += Math.sign(dx); else r2 += Math.sign(dy);
  down = null;
  if (r2 >= 0 && r2 < N && c2 >= 0 && c2 < N) trySwap(r, c, r2, c2);
});
cv.addEventListener('pointerup', () => {
  if (!down) return;
  const [r, c] = down.p;
  down = null;
  if (selected) {
    const [sr, sc] = selected;
    if (Math.abs(sr - r) + Math.abs(sc - c) === 1) { trySwap(sr, sc, r, c); return; }
    if (sr === r && sc === c) { selected = null; return; }
  }
  selected = [r, c];
});

function updateHud() {
  document.getElementById('score').textContent = score;
  document.getElementById('moves').textContent = moves;
  if (score > best) {
    best = score;
    try { localStorage.setItem('gemBest', best); } catch (e) {}
  }
  document.getElementById('best').textContent = best;
}

function gameOver() {
  document.getElementById('finalScore').textContent = `최종 점수: ${score}점`;
  document.getElementById('overlay').classList.add('show');
}

function startGame() {
  score = 0; moves = MAX_MOVES; busy = false; selected = null; hint = null;
  particles = []; floaters = [];
  newBoard();
  updateHud();
  document.getElementById('overlay').classList.remove('show');
}

document.getElementById('hintBtn').onclick = () => { if (!busy) { hint = findMove(); } };
document.getElementById('newBtn').onclick = startGame;
document.getElementById('againBtn').onclick = startGame;
window.addEventListener('resize', resize);

resize();
startGame();
requestAnimationFrame(render);
</script>
</body>
</html>
